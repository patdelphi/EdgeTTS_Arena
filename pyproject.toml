[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgetts-arena"
version = "0.1.0"
description = "CPU-first local arena for comparing and benchmarking lightweight TTS models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "EdgeTTS-Arena contributors"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.28",
  "pydantic>=2.6",
  "numpy>=1.24",
  "soundfile>=0.12",
  "psutil>=5.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.20"]
onnx = ["onnxruntime>=1.17"]
piper = ["piper-tts>=1.4,<2"]
kokoro = ["kokoro-onnx>=0.6.1,<1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
edgetts-arena = "edgetts_arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "model: requires a real TTS model/runtime",
  "slow: slow integration test",
]
