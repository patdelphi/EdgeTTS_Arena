name: Extended Model Gates

on:
  push:
    paths:
      - ".github/model-gates/melotts.trigger"
  workflow_dispatch:
    inputs:
      model:
        description: "Heavy model gate to run"
        required: true
        default: melotts
        type: choice
        options:
          - melotts
          - cosyvoice
          - qwen3
          - both
          - all

jobs:
  melotts-cpu-smoke:
    if: ${{ github.event_name == 'push' || inputs.model == 'melotts' || inputs.model == 'both' || inputs.model == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and pinned MeloTTS source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install "git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a"
      - name: Prepare UniDic dictionary
        run: |
          python -m unidic download
          python - <<'PY'
          import MeCab
          parsed = MeCab.Tagger().parse("テスト")
          assert parsed
          print(parsed.splitlines()[0])
          PY
      - name: Prepare NLTK G2P resources
        run: |
          python - <<'PY'
          import nltk
          from nltk import pos_tag
          for package in ("averaged_perceptron_tagger", "averaged_perceptron_tagger_eng", "cmudict"):
              if not nltk.download(package, quiet=True):
                  raise RuntimeError(f"failed to download NLTK resource: {package}")
          tagged = pos_tag(["EdgeTTS", "Arena"])
          assert tagged and len(tagged) == 2
          print(tagged)
          PY
      - name: Prepare Chinese model files
        run: |
          mkdir -p models/melotts/zh exports/extended-gates
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          revision = "082ca057e44f1e52ec47e1622a30286019e8a3ef"
          for filename in ("config.json", "checkpoint.pth"):
              hf_hub_download(repo_id="myshell-ai/MeloTTS-Chinese", filename=filename, revision=revision, local_dir="models/melotts/zh")
          PY
          cat > models/melotts/zh/model.json <<'JSON'
          {"language":"ZH","config_path":"config.json","ckpt_path":"checkpoint.pth"}
          JSON
      - name: Real MeloTTS CPU synthesis
        run: |
          python scripts/real_model_smoke.py melotts \
            --model-path models/melotts/zh/model.json \
            --text "你好，这是一条 EdgeTTS Arena 的 MeloTTS CPU 验证语音。" \
            --threads 2 \
            --output exports/extended-gates/melotts.wav \
            --report exports/extended-gates/melotts.json
          test -s exports/extended-gates/melotts.wav
          test -s exports/extended-gates/melotts.json
      - uses: actions/upload-artifact@v4
        with:
          name: melotts-cpu-smoke
          path: exports/extended-gates/

  cosyvoice-cpu-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.model == 'cosyvoice' || inputs.model == 'both' || inputs.model == 'all') }}
    uses: ./.github/workflows/cosyvoice-model-gate.yml

  qwen3-cpu-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.model == 'qwen3' || inputs.model == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and official Qwen3-TTS CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install "qwen-tts==0.1.1"
      - name: Prepare pinned Qwen3-TTS 0.6B CustomVoice snapshot
        run: |
          mkdir -p exports/extended-gates
          python scripts/prepare_qwen3_model.py \
            --revision f3d1af06e4eaefac12b1ffa6726f9eef674a6f02 \
            --output models/qwen3/Qwen3-TTS-12Hz-0.6B-CustomVoice
      - name: Real Qwen3-TTS CPU synthesis
        run: |
          python scripts/real_model_smoke.py qwen3 \
            --model-path models/qwen3/Qwen3-TTS-12Hz-0.6B-CustomVoice \
            --voice Vivian \
            --text "你好，这是一条 EdgeTTS Arena 的 Qwen3 TTS CPU 验证语音。" \
            --threads 2 \
            --output exports/extended-gates/qwen3.wav \
            --report exports/extended-gates/qwen3.json
          test -s exports/extended-gates/qwen3.wav
          test -s exports/extended-gates/qwen3.json
      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-cpu-smoke
          path: exports/extended-gates/
