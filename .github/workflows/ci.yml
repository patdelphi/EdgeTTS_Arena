name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: python -m edgetts_arena dummy --text "CI smoke test" --output exports/ci-dummy.wav

  piper-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Piper runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[piper]"
      - name: Download low-quality Piper test voice
        run: python -m piper.download_voices en_US-lessac-low --data-dir models/piper
      - name: Real Piper CPU smoke test
        run: |
          python -m edgetts_arena piper \
            --model models/piper/en_US-lessac-low.onnx \
            --text "Edge TTS Arena real Piper smoke test." \
            --threads 2 \
            --output exports/ci-piper.wav
          test -s exports/ci-piper.wav

  kokoro-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Kokoro runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kokoro]"
      - name: Download Kokoro v1 int8 model
        run: |
          mkdir -p models/kokoro
          curl -fL --retry 3 -o models/kokoro/kokoro-v1.0.int8.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -fL --retry 3 -o models/kokoro/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Real Kokoro CPU smoke test
        run: |
          python -m edgetts_arena kokoro \
            --model models/kokoro/kokoro-v1.0.int8.onnx \
            --voice af_heart \
            --text "Edge TTS Arena real Kokoro smoke test." \
            --threads 2 \
            --output exports/ci-kokoro.wav
          test -s exports/ci-kokoro.wav
