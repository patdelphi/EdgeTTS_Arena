name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: python -m edgetts_arena dummy --text "CI smoke test" --output exports/ci-dummy.wav

  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Cross-platform Dummy smoke
        run: python -m edgetts_arena dummy --text "cross platform smoke" --output exports/cross-platform.wav
      - name: Cross-platform spawn worker smoke
        run: pytest -q tests/test_watchdog.py::test_repeated_suite_uses_spawn_worker_and_writes_representative_audio
      - name: Verify WAV and API startup
        run: >-
          python -c "from pathlib import Path; from fastapi.testclient import TestClient; from edgetts_arena.api import create_app; p=Path('exports/cross-platform.wav'); assert p.is_file() and p.stat().st_size > 44; c=TestClient(create_app()); assert c.get('/healthz').status_code == 200; assert c.get('/api/v1/benchmark/presets').status_code == 200"

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install UI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"
      - name: UI smoke tests
        run: pytest tests/test_ui_presenter.py tests/test_blind_ab.py tests/test_ui_gradio_smoke.py

  piper-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Piper runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[piper]"
      - name: Download low-quality Piper test voice
        run: python -m piper.download_voices en_US-lessac-low --data-dir models/piper
      - name: Real Piper CPU smoke test
        run: |
          python -m edgetts_arena piper \
            --model models/piper/en_US-lessac-low.onnx \
            --text "Edge TTS Arena real Piper smoke test." \
            --threads 2 \
            --output exports/ci-piper.wav
          test -s exports/ci-piper.wav

  kokoro-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Kokoro runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[kokoro]"
      - name: Download Kokoro v1 int8 model
        run: |
          mkdir -p models/kokoro
          curl -fL --retry 3 -o models/kokoro/kokoro-v1.0.int8.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -fL --retry 3 -o models/kokoro/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Real Kokoro CPU smoke test
        run: |
          python -m edgetts_arena kokoro \
            --model models/kokoro/kokoro-v1.0.int8.onnx \
            --voice af_heart \
            --text "Edge TTS Arena real Kokoro smoke test." \
            --threads 2 \
            --output exports/ci-kokoro.wav
          test -s exports/ci-kokoro.wav
